# Render "Blueprint" — lets Render auto-configure the service when you
# connect this repo, instead of clicking through settings by hand.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: sperrwarner
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_DEBUG
        value: "false"
    healthCheckPath: /
